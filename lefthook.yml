pre-commit:
  # oxlint --fix and oxfmt --write both rewrite staged files, so they cannot run
  # in parallel without racing on the same paths. Run them sequentially via
  # priority (lower runs first): oxlint sorts the named imports, then oxfmt sorts
  # and formats the statements, so oxfmt has the final say on layout.
  commands:
    oxlint:
      priority: 1
      glob: "**/*.ts"
      stage_fixed: true
      run: pnpm exec oxlint --fix --deny-warnings {staged_files}
    oxfmt:
      priority: 2
      # "{,**/}" matches both root-level files and any nested path; a bare
      # "**/*" skips the repo root (CLAUDE.md, CONTRIBUTING.md, README.md),
      # which then drift out of format until CI's whole-tree oxfmt --check.
      glob: "{,**/}*.{ts,json,md}"
      stage_fixed: true
      run: pnpm exec oxfmt --write {staged_files}
    prettier-svelte:
      priority: 3
      # oxfmt does not recognize .svelte and silently skips it; prettier-plugin-svelte
      # formats widget markup/styles. This rewrites a DISJOINT file set (.svelte only,
      # never .ts/.json/.md), so it can't race oxlint/oxfmt above — the priority is for
      # determinism, not safety. Pass --plugin explicitly (no discoverable prettier
      # config) so oxfmt stays the sole formatter for everything that isn't .svelte.
      glob: "{,**/}*.svelte"
      stage_fixed: true
      run: pnpm exec prettier --plugin prettier-plugin-svelte --write {staged_files}

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

pre-push:
  commands:
    typecheck:
      run: pnpm typecheck
    test:
      run: pnpm test
