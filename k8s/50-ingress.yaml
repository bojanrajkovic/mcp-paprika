# NOT YET DEPLOYABLE — see k8s/README.md "Public ingress" section.
#
# The mcp-paprika server has no built-in authentication, so a public ingress
# that Anthropic's MCP relay can reach is unsafe today. Once the server
# implements the MCP OAuth flow (`/.well-known/oauth-authorization-server`,
# 401 on unauthenticated requests, bearer-token validation), this Ingress
# becomes the right shape. Until then, the kustomization deliberately omits
# it — apply per-environment manually after auth lands.
#
# Two viable shapes when that happens:
#
# 1) Tailscale Funnel (public on the internet, TLS handled by Tailscale):
#
#    apiVersion: networking.k8s.io/v1
#    kind: Ingress
#    metadata:
#      name: mcp-paprika-funnel
#      namespace: mcp-paprika
#      annotations:
#        tailscale.com/funnel: "true"
#    spec:
#      ingressClassName: tailscale
#      tls:
#        - hosts: [mcp-paprika]
#      defaultBackend:
#        service:
#          name: mcp-paprika
#          port: { number: 80 }
#
# 2) Traefik public hostname (open the firewall, cert-manager for TLS):
#
#    Use the existing *.services.coderinserepeat.com convention pointed at a
#    public-DNS variant. Same shape as outline/karakeep ingresses.
