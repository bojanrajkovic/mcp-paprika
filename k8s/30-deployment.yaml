apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-paprika
  namespace: mcp-paprika
  labels:
    app.kubernetes.io/name: mcp-paprika
    app.kubernetes.io/instance: mcp-paprika
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-paprika
      app.kubernetes.io/instance: mcp-paprika
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-paprika
        app.kubernetes.io/instance: mcp-paprika
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp-paprika
          # Bump tag on each push; see README § "Update the image".
          image: ghcr.io/bojanrajkovic/mcp-paprika:<tag>
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: MCP_TRANSPORT
              value: http
            - name: MCP_HTTP_PORT
              value: "3000"
            - name: MCP_HTTP_HOST
              value: 0.0.0.0
            # OAuth deployment fields. Set MCP_PUBLIC_URL to the publicly
            # reachable URL for this deployment. Upstream IdP is Google via
            # the `google` preset; client credentials + allowlist live in
            # the mcp-paprika Secret.
            - name: MCP_PUBLIC_URL
              value: https://<public-host>
            # google preset works for Google accounts. Tenant-bound presets
            # (entra, okta, auth0, keycloak) also require MCP_OIDC_DISCOVERY_URL
            # in the Secret — omitting it causes the server to exit at startup.
            # Alternatively, drop this var and set MCP_OIDC_DISCOVERY_URL only.
            # See docs/configuration.md for the full OAuth reference.
            - name: MCP_OIDC_PRESET
              value: google
            # Leave false unless a trusted reverse proxy (nginx, Tailscale
            # Funnel, Cloudflare) sanitizes X-Forwarded-For before this pod.
            # Setting true without a sanitizing proxy lets clients spoof IPs
            # and bypass DCR rate limiting. See docs/configuration.md § "Trust proxy".
            - name: MCP_TRUST_PROXY
              value: "false"
            # Let AI photo generation (generate_recipe_photo) reuse the embeddings
            # provider's API key + base URL instead of a separate IMAGE_GEN_API_KEY.
            # Requires features.embeddings to be configured (creds live in the Secret).
            # See docs/configuration.md § image generation.
            - name: IMAGE_GEN_REUSE_EMBEDDINGS_CREDS
              value: "true"
            # OpenTelemetry: traces + metrics export over OTLP/HTTP to the cluster
            # collector (Grafana Alloy). The image's --import preload makes the OTel
            # ESM loader hook effective here. See docs/telemetry.md.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: https://alloy.services.coderinserepeat.com:4318
            - name: OTEL_SERVICE_NAME
              value: mcp-paprika
            - name: OTEL_TRACES_SAMPLER
              value: parentbased_always_on
            # MCP clients (ChatGPT, Claude) send a W3C traceparent, but they export to
            # their own backends, not ours — adopting their trace context leaves every
            # trace rooted in a span this collector never receives ("root span not yet
            # received" in Tempo). Disable propagation so each request is a fresh root;
            # nothing downstream (Paprika, the OIDC provider) shares this trace backend.
            - name: OTEL_PROPAGATORS
              value: none
            # k8s resource attributes via the downward API — the SDK's env
            # detector reads OTEL_RESOURCE_ATTRIBUTES, so this needs no app
            # support and works without a collector-side k8sattributes
            # processor. (The container-id detector often comes up empty on
            # cgroup v2 hosts; these are the reliable identity attributes.)
            - name: OTEL_K8S_POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: OTEL_K8S_POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - name: OTEL_K8S_POD_UID
              valueFrom: { fieldRef: { fieldPath: metadata.uid } }
            - name: OTEL_K8S_NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: k8s.pod.name=$(OTEL_K8S_POD_NAME),k8s.namespace.name=$(OTEL_K8S_POD_NAMESPACE),k8s.pod.uid=$(OTEL_K8S_POD_UID),k8s.node.name=$(OTEL_K8S_NODE_NAME),k8s.deployment.name=mcp-paprika
          envFrom:
            - secretRef:
                name: mcp-paprika
          volumeMounts:
            - name: data
              mountPath: /data
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mcp-paprika-data
          # No storage class? Replace the above with:
          # emptyDir: {}
          # Cache rebuilds on restart; OAuth state is lost on pod delete.
      terminationGracePeriodSeconds: 30
