apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-paprika
  namespace: mcp-paprika
  labels:
    app.kubernetes.io/name: mcp-paprika
    app.kubernetes.io/instance: mcp-paprika
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-paprika
      app.kubernetes.io/instance: mcp-paprika
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-paprika
        app.kubernetes.io/instance: mcp-paprika
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp-paprika
          # Bump tag on each push; `kubectl set image` or rollout restart for redeploys.
          image: harbor.services.coderinserepeat.com/mcp-paprika/mcp-paprika:1.2.0-rc1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: MCP_TRANSPORT
              value: http
            - name: MCP_HTTP_PORT
              value: "3000"
            - name: MCP_HTTP_HOST
              value: 0.0.0.0
            # OAuth deployment fields. Public URL comes from the Tailscale
            # Funnel ingress (host paprika → paprika.gaur-kardashev.ts.net).
            # Upstream IdP is Google via the `google` preset; client credentials
            # + allowlist live in the mcp-paprika Secret.
            - name: MCP_PUBLIC_URL
              value: https://paprika.gaur-kardashev.ts.net
            - name: MCP_OIDC_PRESET
              value: google
            # Tailscale Funnel is the only ingress in front of this pod and it
            # sanitizes X-Forwarded-For, so MCP_TRUST_PROXY=true lets the DCR
            # rate-limiter key off the real client tailnet address instead of
            # collapsing every public request into the funnel pod's address.
            # See src/auth/routes.ts:buildDcrRateLimit for the safety analysis.
            - name: MCP_TRUST_PROXY
              value: "true"
          envFrom:
            - secretRef:
                name: mcp-paprika
          volumeMounts:
            - name: data
              mountPath: /data
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mcp-paprika-data
      terminationGracePeriodSeconds: 30
