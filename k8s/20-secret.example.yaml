# Template for the mcp-paprika Secret. Copy to k8s/secret.yaml (gitignored)
# and fill in the values, OR create the secret imperatively with
# `kubectl -n mcp-paprika create secret generic mcp-paprika --from-literal=…`
# (see k8s/README.md). This file is NOT included in kustomization.yaml so
# real credentials never get committed.
apiVersion: v1
kind: Secret
metadata:
  name: mcp-paprika
  namespace: mcp-paprika
  labels:
    app.kubernetes.io/name: mcp-paprika
    app.kubernetes.io/instance: mcp-paprika
type: Opaque
stringData:
  # Paprika account credentials.
  PAPRIKA_EMAIL: replace-me@example.com
  PAPRIKA_PASSWORD: replace-me

  # Google OAuth 2.0 Web client credentials (from Google Cloud Console →
  # APIs & Services → Credentials). The Authorized redirect URI on that
  # client must be exactly:
  #   https://<your-public-url>/oauth/callback
  MCP_OIDC_CLIENT_ID: replace-me.apps.googleusercontent.com
  MCP_OIDC_CLIENT_SECRET: GOCSPX-replace-me

  # Allowlist — at least one of emails/subs must be non-empty. Comma-separated.
  MCP_ALLOWED_EMAILS: replace-me@example.com
  # MCP_ALLOWED_SUBS: 1234567890

  # Optional — only set if you turn on semantic search.
  # OPENAI_API_KEY: sk-...
  # OPENAI_BASE_URL: https://api.openai.com/v1
  # EMBEDDING_MODEL: text-embedding-3-small
