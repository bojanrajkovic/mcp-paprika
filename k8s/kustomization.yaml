apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mcp-paprika

resources:
  - 00-namespace.yaml
  - 10-pvc.yaml
  - 30-deployment.yaml
  - 40-service.yaml
  # Ingress is NOT included — it's too environment-specific.
  # See 50-ingress.example.tailscale-funnel.yaml for a Tailscale Funnel example.
  # Secret is applied separately — see k8s/README.md.
  # Don't add secret.yaml here; it's gitignored.

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/name: mcp-paprika
      app.kubernetes.io/instance: mcp-paprika
      app.kubernetes.io/part-of: mcp-paprika
