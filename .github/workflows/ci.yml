name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - run: corepack enable

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.18.0"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  prod-widgets:
    name: Prod prune serves widgets
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - run: corepack enable

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.18.0"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build with the full toolchain (esbuild/svelte are devDependencies)...
      - name: Build
        run: pnpm build

      # ...then drop devDependencies and prove the widget runtime path imports
      # none of them — a leaked esbuild/svelte/ext-apps import would only crash in
      # the prod container otherwise (ADR-0019, risk g).
      # --ignore-scripts: the `prepare` lifecycle (lefthook install) would fail
      # once lefthook itself is pruned.
      - name: Prune to production dependencies
        run: pnpm prune --prod --ignore-scripts

      - name: Verify widgets serve with prod-only deps
        run: node scripts/verify-prod-widgets.mjs
