name: Publish to npm

on:
  release:
    types: [published]

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - run: corepack enable

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.17.0"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Stable releases publish to the `latest` dist-tag (npm's default when
      # no `--tag` is given). Prereleases publish under a dist-tag derived
      # from the semver prerelease identifier (1.2.0-beta.0 → @beta,
      # 1.2.0-rc.1 → @rc, 0.0.0-smoketest.N → @smoketest), so `npm install`
      # without a tag always lands on a stable version. The in-workflow
      # `npm version` bumps the runner's package.json to match the release
      # tag — it is never committed back, so the source-of-truth in main
      # only changes when release-please cuts a stable bump-PR.
      - name: Publish
        env:
          TAG: ${{ github.event.release.tag_name }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [ "$IS_PRERELEASE" = "true" ]; then
            VERSION="${TAG#v}"
            DIST_TAG=$(printf '%s' "$VERSION" | sed -nE 's/^[0-9]+\.[0-9]+\.[0-9]+-([a-z][a-z0-9]*).*/\1/p')
            DIST_TAG="${DIST_TAG:-next}"
            echo "Publishing prerelease $VERSION under dist-tag @$DIST_TAG"
            npm version --no-git-tag-version --allow-same-version "$VERSION"
            npm publish --provenance --ignore-scripts --tag "$DIST_TAG"
          else
            npm publish --provenance --ignore-scripts
          fi
